[book]
title = "Pop Cart Manual"
authors = ["Sweet Robo"]
language = "en"
multilingual = false
src = "."

[build]
build-dir = "../build/pop-cart"

[preprocessor.links]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/sweetrobo/SweetRoboManuals"
git-repository-icon = "fa-github"
additional-css = ["shared/css/manual-styles.css", "shared/css/variables.css", "shared/css/typography.css", "shared/css/components.css", "shared/css/images.css", "shared/css/layout.css", "shared/css/conditional.css", "shared/css/custom-print.css"]
additional-js = ["shared/js/custom.js"]
favicon = "shared/images/sweetrobo-logo.webp"
site-url = "https://sweetrobo.com/manuals/pop-cart/"

[output.html.metadata]
description = "User manual for the Pop Cart popcorn vending machine. Setup, operation, maintenance, and troubleshooting guide."
keywords = "Pop Cart, Sweet Robo, popcorn machine, vending, manual, setup, operation, maintenance"
author = "Sweet Robo"
image = "shared/images/sweetrobo-logo.webp"

[output.html.print]
enable = true
page-break = true

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true