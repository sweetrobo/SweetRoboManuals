[book]
title = "Robo Ice Cream F2 Manual"
authors = ["Sweet Robo"]
language = "en"
multilingual = false
src = "."

[build]
build-dir = "../build/robo-ice-cream"

[preprocessor.links]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/sweetrobo/SweetRoboManuals"
git-repository-icon = "fa-github"
additional-css = ["shared/css/custom.css", "shared/css/manual-styles.css", "shared/css/variables.css", "shared/css/typography.css", "shared/css/components.css", "shared/css/images.css", "shared/css/layout.css", "shared/css/conditional.css", "shared/css/print.css"]
additional-js = ["shared/js/custom.js"]
favicon = "assets/logo.webp"
site-url = "https://sweetrobo.com/manuals/robo-ice-cream/"

[output.html.metadata]
description = "Comprehensive user manual for the Robo Ice Cream F2 machine. Setup, operation, maintenance, and troubleshooting guide."
keywords = "Robo Ice Cream, Sweet Robo, ice cream machine, manual, F2, setup, operation, maintenance"
author = "Sweet Robo"
image = "assets/overview/robo-ice-cream-f2.webp"

[output.html.print]
enable = true
page-break = true

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true